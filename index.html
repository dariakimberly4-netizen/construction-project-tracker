<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Construction Project Tracker</title>
  <link rel="stylesheet" href="styles.css?v=9" />






<style id="mobile-readable-v9">
@media (max-width:760px){
  html,body,#app{margin:0!important;width:100%!important;min-height:100%!important;overflow-x:hidden!important}
  body{background:#06100d!important}
  #orbitView.screen.active{
    display:flex!important;
    flex-direction:column!important;
    width:100%!important;
    min-height:100dvh!important;
    height:auto!important;
    padding:12px 14px 16px!important;
    overflow:visible!important;
  }
  #homeFit{
    position:static!important;
    width:100%!important;
    min-height:0!important;
    padding:0!important;
    transform:none!important;
  }
  #homeFit .topbar{
    width:100%!important;
    margin:0 0 8px!important;
    align-items:flex-start!important;
  }
  #homeFit .topbar h1{
    font-size:27px!important;
    line-height:1.05!important;
  }
  #homeFit .eyebrow{
    font-size:9px!important;
    letter-spacing:.12em!important;
    margin-bottom:4px!important;
  }
  #homeFit .status-pill{
    font-size:9px!important;
    padding:7px 9px!important;
  }
  #homeFit .orbit-wrap{
    width:92vw!important;
    height:92vw!important;
    aspect-ratio:1/1!important;
    margin:4px auto 8px!important;
    transform:none!important;
  }
  #homeFit .module{
    width:22vw!important;
    height:22vw!important;
    max-width:92px!important;
    max-height:92px!important;
    min-width:76px!important;
    min-height:76px!important;
    border-width:1.5px!important;
  }
  #homeFit .module b{
    font-size:13px!important;
    line-height:1.05!important;
  }
  #homeFit .module span{
    font-size:9px!important;
    margin-bottom:3px!important;
  }
  #homeFit .core{
    width:34vw!important;
    height:34vw!important;
    max-width:142px!important;
    max-height:142px!important;
  }
  #homeFit .core h2{
    font-size:20px!important;
    line-height:.98!important;
  }
  #homeFit .core p{
    display:block!important;
    font-size:9px!important;
    line-height:1.1!important;
    margin:7px 12px 0!important;
  }
  #homeFit .quick-metrics{
    width:100%!important;
    display:grid!important;
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
    gap:8px!important;
    margin:4px 0 0!important;
  }
  #homeFit .quick-metrics div{
    padding:10px 8px!important;
    border-radius:13px!important;
  }
  #homeFit .quick-metrics strong{
    font-size:18px!important;
    line-height:1.05!important;
  }
  #homeFit .quick-metrics span{
    font-size:10px!important;
    line-height:1.1!important;
  }
}
</style>
</head>
<body>
  <main id="app">
    <section id="orbitView" class="screen active">
      <div id="homeFit" class="home-fit">
      <div class="topbar">
        <div><p class="eyebrow">CONSTRUCTION PROJECT TRACKER</p><h1>Project Control</h1></div>
        <div class="status-pill">● LIVE DEMO</div>
      </div>
      <div class="orbit-wrap">
        <div class="orbit-ring ring-1"></div><div class="orbit-ring ring-2"></div>
        <button class="module module-1" data-module="projects"><span>01</span><b>Projects</b></button>
        <button class="module module-2" data-module="progress"><span>02</span><b>Progress</b></button>
        <button class="module module-3" data-module="workers"><span>03</span><b>Workers</b></button>
        <button class="module module-4" data-module="materials"><span>04</span><b>Materials</b></button>
        <button class="module module-5" data-module="costs"><span>05</span><b>Costs</b></button>
        <button class="module module-6" data-module="schedule"><span>06</span><b>Schedule</b></button>
        <button class="module module-7" data-module="site"><span>07</span><b>Site</b></button>
        <button class="module module-8" data-module="reports"><span>08</span><b>Reports</b></button>
        <div class="core"><div class="helmet">⬢</div><h2>PROJECT<br/>CONTROL</h2><p>One project. One source of truth.</p></div>
      </div>
      <div class="quick-metrics">
        <div><strong>48%</strong><span>Completion</span></div>
        <div><strong>₱2.13M</strong><span>Spent</span></div>
        <div><strong>27</strong><span>On Site</span></div>
        <div><strong>5 days</strong><span>Behind</span></div>
      </div>
      </div>
    </section>
    <section id="moduleView" class="screen">
      <div class="module-shell">
        <div class="module-header">
          <button id="backBtn" class="back-btn">← Back to Project Control</button>
          <div><p id="moduleEyebrow" class="eyebrow"></p><h2 id="moduleTitle"></h2></div>
          <button id="newRecordBtn" class="primary-btn">+ New Record</button>
        </div>
        <div id="moduleContent"></div>
      </div>
    </section>
  </main>
  <script src="app.js?v=9"></script>
</body>
</html>
