<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Construction Project Tracker</title>
  <link rel="stylesheet" href="styles.css?v=6" />

<style id="mobile-fix-v6">
@media (max-width:760px){
  html,body{margin:0!important;min-height:100%!important;background:#06100d!important}
  #orbitView.screen.active{
    display:flex!important;
    flex-direction:column!important;
    min-height:100svh!important;
    height:100svh!important;
    overflow:hidden!important;
    padding:12px 12px 10px!important;
  }
  #orbitView .topbar{flex:0 0 auto!important}
  #orbitView .orbit-wrap{
    flex:1 1 auto!important;
    width:96vw!important;
    height:auto!important;
    aspect-ratio:1/1!important;
    margin:10px auto 0!important;
    align-self:center!important;
    transform:none!important;
  }
  #orbitView .quick-metrics{
    flex:0 0 auto!important;
    width:100%!important;
    grid-template-columns:repeat(4,minmax(0,1fr))!important;
    gap:6px!important;
    margin:8px 0 0!important;
  }
  #orbitView .quick-metrics div{padding:9px 4px!important}
  #orbitView .quick-metrics strong{font-size:15px!important}
  #orbitView .quick-metrics span{font-size:9px!important}

  /* occupy the remaining vertical area rather than leaving a blank lower half */
  #orbitView::after{
    content:"";
    flex:1 1 auto;
    min-height:0;
  }
}
@media (max-width:760px) and (min-height:780px){
  #orbitView .orbit-wrap{
    width:min(96vw,58svh)!important;
  }
  #orbitView::after{flex-grow:0!important}
  #orbitView.screen.active{justify-content:space-between!important}
}
</style>
</head>
<body>
  <main id="app">
    <section id="orbitView" class="screen active">
      <div class="topbar">
        <div><p class="eyebrow">CONSTRUCTION PROJECT TRACKER</p><h1>Project Control</h1></div>
        <div class="status-pill">● LIVE DEMO</div>
      </div>
      <div class="orbit-wrap">
        <div class="orbit-ring ring-1"></div><div class="orbit-ring ring-2"></div>
        <button class="module module-1" data-module="projects"><span>01</span><b>Projects</b></button>
        <button class="module module-2" data-module="progress"><span>02</span><b>Progress</b></button>
        <button class="module module-3" data-module="workers"><span>03</span><b>Workers</b></button>
        <button class="module module-4" data-module="materials"><span>04</span><b>Materials</b></button>
        <button class="module module-5" data-module="costs"><span>05</span><b>Costs</b></button>
        <button class="module module-6" data-module="schedule"><span>06</span><b>Schedule</b></button>
        <button class="module module-7" data-module="site"><span>07</span><b>Site</b></button>
        <button class="module module-8" data-module="reports"><span>08</span><b>Reports</b></button>
        <div class="core"><div class="helmet">⬢</div><h2>PROJECT<br/>CONTROL</h2><p>One project. One source of truth.</p></div>
      </div>
      <div class="quick-metrics">
        <div><strong>48%</strong><span>Completion</span></div>
        <div><strong>₱2.13M</strong><span>Spent</span></div>
        <div><strong>27</strong><span>On Site</span></div>
        <div><strong>5 days</strong><span>Behind</span></div>
      </div>
    </section>
    <section id="moduleView" class="screen">
      <div class="module-shell">
        <div class="module-header">
          <button id="backBtn" class="back-btn">← Back to Project Control</button>
          <div><p id="moduleEyebrow" class="eyebrow"></p><h2 id="moduleTitle"></h2></div>
          <button id="newRecordBtn" class="primary-btn">+ New Record</button>
        </div>
        <div id="moduleContent"></div>
      </div>
    </section>
  </main>
  <script src="app.js?v=6"></script>
</body>
</html>
